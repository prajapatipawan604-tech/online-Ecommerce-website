<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - ShopEasy</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


    <!-- Navbar -->

    <header>

        <nav class="navbar">

            <h1 class="logo">
                ShopEasy
            </h1>


            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="index.html#products">
                        Products
                    </a>
                </li>

                <li>
                    <a href="login.html">
                        Login
                    </a>
                </li>

            </ul>


            <div class="cart">
                🛒 Cart
            </div>

        </nav>

    </header>


    <!-- Register -->

    <main class="auth-container">

        <div class="auth-card">


            <h2>
                Create Account
            </h2>


            <p class="auth-subtitle">
                Create your ShopEasy account
            </p>


            <form
                id="register-form"
                class="auth-form"
            >


                <label for="register-name">
                    Full Name
                </label>


                <input
                    type="text"
                    id="register-name"
                    placeholder="Enter your full name"
                    required
                >


                <label for="register-email">
                    Email Address
                </label>


                <input
                    type="email"
                    id="register-email"
                    placeholder="Enter your email"
                    required
                >


                <label for="register-password">
                    Password
                </label>


                <input
                    type="password"
                    id="register-password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >


                <p class="password-note">
                    Password must contain at least 6 characters.
                </p>


                <label for="register-confirm-password">
                    Confirm Password
                </label>


                <input
                    type="password"
                    id="register-confirm-password"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="auth-submit"
                >
                    Create Account
                </button>

            </form>


            <div
                id="register-message"
                class="auth-message"
            ></div>


            <div class="auth-links">

                <p>
                    Already have an account?
                </p>

                <a href="login.html">
                    Login
                </a>


                <p>
                    <a href="index.html">
                        ← Back to Shop
                    </a>
                </p>

            </div>


        </div>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 ShopEasy.
            All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
