<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - ShopEasy</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
   <header>
    <nav class="navbar">

        <h1 class="logo">
            ShopEasy
        </h1>

        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="index.html#products">
                    Products
                </a>
            </li>

            <li>
                <a href="index.html#about">
                    About
                </a>
            </li>

            <li>
                <a href="index.html#contact">
                    Contact
                </a>
            </li>

            <li>
                <a href="orders.html">
                    My Orders
                </a>
            </li>

            <li>
                <a href="login.html">
                    Login
                </a>
            </li>

        </ul>

        <div class="cart">
            🛒 Cart
        </div>

    </nav>
</header>


    <!-- Orders -->
    <main class="orders-container">

        <h2>My Orders</h2>

        <div id="ordersList">
            <p>Loading orders...</p>
        </div>

    </main>


    <script>

        const API_URL = "http://localhost:5000/api";


        // Load orders
        async function loadOrders() {

           const token = localStorage.getItem("shopEasyToken");

            // Check login
            if (!token) {

                alert("Please login first.");

                window.location.href = "login.html";

                return;
            }


            try {

                const response = await fetch(`${API_URL}/orders`, {

                    method: "GET",

                    headers: {
                        "Authorization": `Bearer ${token}`
                    }

                });


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message || "Unable to load orders"
                    );
                }


                displayOrders(data.orders || data);


            } catch (error) {

                console.error("Orders error:", error);

                document.getElementById("ordersList").innerHTML = `
                    <div class="error-message">
                        <h3>Unable to load orders</h3>
                        <p>Please try again later.</p>
                    </div>
                `;
            }
        }



        // Display orders
        function displayOrders(orders) {

            const container =
                document.getElementById("ordersList");


            // No orders
            if (!orders || orders.length === 0) {

                container.innerHTML = `

                    <div class="empty-orders">

                        <h3>No orders yet</h3>

                        <p>
                            You haven't placed any orders yet.
                        </p>

                        <a href="index.html">
                            Start Shopping
                        </a>

                    </div>

                `;

                return;
            }


            // Show orders
            container.innerHTML = orders.map(order => `

                <div class="order-card">

                    <div class="order-header">

                        <h3>
                            Order #${order.id}
                        </h3>

                        <span class="order-status">
                            ${order.status}
                        </span>

                    </div>


                    <p>
                        <strong>Date:</strong>
                        ${new Date(
                            order.created_at
                        ).toLocaleDateString()}
                    </p>


                    <p class="order-total">

                        Total:
                        <strong>
                            Rs. ${order.total_amount}
                        </strong>

                    </p>
                    <a
    href="order-details.html?id=${order.id}"
    class="view-order-btn"
>
    View Details
</a>

                </div>

            `).join("");
        }



        // Logout
        function logout() {

            localStorage.removeItem("shopEasyToken");

            localStorage.removeItem("shopEasyLoggedInUser");

            window.location.href = "login.html";
        }



        // Start
        loadOrders();

    </script>

</body>
</html>
