<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - ShopEasy</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


    <!-- Navbar -->

    <header>

        <nav class="navbar">

            <h1 class="logo">
                ShopEasy
            </h1>


            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="index.html#products">
                        Products
                    </a>
                </li>

                <li>
                    <a href="register.html">
                        Create Account
                    </a>
                </li>

            </ul>


            <div class="cart">
                🛒 Cart
            </div>

        </nav>

    </header>


    <!-- Login -->

    <main class="auth-container">

        <div class="auth-card">


            <h2>
                Welcome Back
            </h2>


            <p class="auth-subtitle">
                Login to your ShopEasy account
            </p>


            <form
                id="login-form"
                class="auth-form"
            >


                <label for="login-email">
                    Email Address
                </label>


                <input
                    type="email"
                    id="login-email"
                    placeholder="Enter your email"
                    required
                >


                <label for="login-password">
                    Password
                </label>


                <input
                    type="password"
                    id="login-password"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="submit"
                    class="auth-submit"
                >
                    Login
                </button>

            </form>


            <div
                id="login-message"
                class="auth-message"
            ></div>


            <div class="auth-links">

                <p>
                    Don't have an account?
                </p>

                <a href="register.html">
                    Create Account
                </a>


                <p>
                    <a href="index.html">
                        ← Back to Shop
                    </a>
                </p>

            </div>


        </div>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 ShopEasy.
            All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
